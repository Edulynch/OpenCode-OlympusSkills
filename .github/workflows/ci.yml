name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  Gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1, pinned to its verified upstream commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          # SHA-256 for this exact asset, pinned from official release metadata.
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks-bin/gitleaks"
          test "$("$RUNNER_TEMP/gitleaks-bin/gitleaks" version)" = "8.30.1"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Scan all available Git history
        run: gitleaks git --redact=100 --no-banner --log-opts=--all .

  Frontmatter:
    name: Frontmatter
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1, pinned to its verified upstream commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned validator dependency
        run: python -m pip install --disable-pip-version-check --requirement scripts/requirements-ci.txt

      - name: Run parser tests and repository validation
        run: |
          python -B scripts/test_validate_frontmatter.py
          python -B scripts/validate_frontmatter.py
